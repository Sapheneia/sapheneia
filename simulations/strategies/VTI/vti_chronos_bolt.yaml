metadata:
  id: "vti-chronos-bolt"
  version: "1.0.0"
  description: "VTI (Vanguard Total Stock Market Index) backtest using Chronos Bolt-Mini (fast + accurate)"
  author: "Sapheneia"

evaluation:
  ticker: "VTI"
  fetch_start_date: "20211201"
  start_date: "20230101"
  end_date: "20240101"

forecast:
  model: "amazon/chronos-bolt-mini"
  context_size: 252
  horizon_size: 20

trading:
  initial_capital: 100000.0
  initial_position: 0.0
  initial_cash: 100000.0
  strategy_type: "threshold"
  params:
    threshold_type: "absolute"
    threshold_value: 2.0
    execution_size: 10.0
