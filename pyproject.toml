[project]
name = "sapheneia"
version = "2.0.0"
description = "Agentic time-series forecasting and trading-strategy backtesting platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Common across services + CLI
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-dateutil>=2.8.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
]

[project.scripts]
sapheneia = "sapheneia.cli:main"
sapheneia-mcp = "sapheneia_mcp.server:main"

[project.optional-dependencies]

# Forecast service
forecasting = [
    "torch>=2.0.0",
    "timesfm>=1.3.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.10.5",
    "seaborn>=0.13.2",
    "plotly>=5.18.0",
    "slowapi>=0.1.9",
    "requests>=2.31.0",
    "ipython>=8.12.0",
    "python-multipart>=0.0.6",
    "jax>=0.7.0",
    "jaxlib>=0.7.0",
]

# Metrics service
metrics = [
    "quantstats>=0.0.62",
    "ipython>=8.12.0",
]

# Trading service
trading = [
    "slowapi>=0.1.9",
    "requests>=2.31.0",
    "yfinance>=0.2.0",
]

# Data service (Python rewrite)
data = [
    "yfinance>=0.2.0",
]

# Database access (orchestrator + data)
db = [
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",  # alembic runtime only; app code uses asyncpg
]

# MCP server
mcp = [
    "mcp>=1.0.0",
    "sse-starlette>=2.0.0",
]

# Development / testing
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "testcontainers[postgres]>=4.7.0",
    "black>=23.0.0",
    "ruff>=0.4.0",
    "mypy>=1.5.0",
]

# Convenience: install everything
all = [
    "sapheneia[forecasting,metrics,trading,data,db,mcp,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["forecast*", "trading*", "metrics*", "data*", "orchestrator*", "sapheneia*", "sapheneia_mcp*", "shared*"]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests", "migrations", "skills*", "simulations*"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "forecast/models",
    "trading/tests",
    "data/tests",
    "orchestrator/tests",
    "sapheneia_mcp/tests",
    "metrics/tests",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=forecast",
    "--cov=trading",
    "--cov=metrics",
    "--cov=data",
    "--cov=orchestrator",
    "--cov=sapheneia",
    "--cov=sapheneia_mcp",
    "--cov=shared",
    "--cov-report=term",
    "--cov-fail-under=35",
]
markers = [
    "unit: fast in-process tests (default)",
    "integration: tests requiring testcontainers (TimescaleDB) or external services",
    "slow: tests that take more than a few seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["forecast", "trading", "metrics", "data", "orchestrator", "sapheneia", "sapheneia_mcp", "shared"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/__init__.py",
    "migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if False:",
    "if 0:",
]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yml", "*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
