# =============================================================================
# Sapheneia Docker Compose - v2.0
# =============================================================================
# Updated 2026-01-20 for Aleutian integration with 127xx port scheme
#
# Port assignments defined in .env file:
#   ORCHESTRATION_PORT (12700) - Gateway
#   CHRONOS_T5_*_PORT (12710-12714) - Chronos T5 models
#   CHRONOS_BOLT_*_PORT (12715-12717) - Chronos Bolt models
#   TIMESFM_*_PORT (12720-12721) - TimesFM models
#   UI_PORT (12780) - Web interface
#   TRADING_API_PORT (12132) - Trading API
#   DATA_API_PORT (12701) - Data service
# =============================================================================

services:
  # FastAPI Backend - Forecast API Gateway (routes to all models)
  # NOTE: Uses module-level state - MUST run with single worker (UVICORN_WORKERS=1)
  forecast:
    build:
      context: .
      dockerfile: Dockerfile.forecast
      args:
        MODEL_NAME: all
        MODEL_PORT: 8000
    container_name: sapheneia-forecast
    ports:
      - "${ORCHESTRATION_PORT:-12700}:8000"
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MODEL_NAME=all
      - PYTHONPATH=/app
      - API_SECRET_KEY=${API_SECRET_KEY}
      # URLs for dedicated model containers (used by orchestration service)
      - CHRONOS_SERVICE_URL=${CHRONOS_SERVICE_URL:-http://forecast-chronos-t5-tiny:8000}
      - TIMESFM_SERVICE_URL=${TIMESFM_SERVICE_URL:-http://forecast-timesfm:8000}
    volumes:
      - ./forecast:/app/forecast
      - ./data:/app/data
      - ./logs:/app/logs
      - ./simulations:/app/simulations
      - forecast_models_timesfm20:/app/forecast/models/timesfm20/local
      - ${MODELS_CACHE_PATH:-./models_cache}:/models_cache
    networks:
      - aleutian-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ===========================================================================
  # Amazon Chronos T5 Series
  # ===========================================================================

  forecast-chronos-t5-tiny:
    build:
      context: .
      dockerfile: Dockerfile.forecast
      args:
        MODEL_NAME: chronos
        MODEL_PORT: 8000
    container_name: forecast-chronos-t5-tiny
    ports:
      - "${CHRONOS_T5_TINY_PORT:-12710}:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MODEL_NAME=chronos
      - MODEL_VARIANT=amazon/chronos-t5-tiny
      - HF_HOME=/models_cache
      - DEVICE=cpu
      - PYTHONPATH=/app
      - API_SECRET_KEY=${API_SECRET_KEY}
    volumes:
      - ./forecast:/app/forecast
      - ./logs:/app/logs
      - ${MODELS_CACHE_PATH:-./models_cache}:/models_cache
    networks:
      - aleutian-network
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

