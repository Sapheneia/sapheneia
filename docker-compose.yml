  # ===========================================================================
  # UI Service
  # ===========================================================================

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: sapheneia-ui
    ports:
      - "${UI_PORT:-12780}:8080"
    environment:
      - UI_API_BASE_URL=http://forecast:8000
      - UI_PORT=8080
      - PYTHONPATH=/app
    volumes:
      - ./ui:/app/ui
      - ./data:/app/data
      - ./logs:/app/logs
      - ui_results:/app/ui/results
    depends_on:
      forecast:
        condition: service_healthy
    networks:
      - aleutian-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # Trading API Service
  # ===========================================================================

  trading:
    build:
      context: .
      dockerfile: Dockerfile.trading
    container_name: sapheneia-trading
    ports:
      - "${TRADING_API_PORT:-12132}:9000"
    env_file:
      - .env
    environment:
      - TRADING_API_KEY=${TRADING_API_KEY}
      - TRADING_API_HOST=0.0.0.0
      - TRADING_API_PORT=9000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PYTHONPATH=/app
    volumes:
      - ./trading:/app/trading
      - ./logs:/app/logs
    networks:
      - aleutian-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # Data Service (Yahoo Finance → InfluxDB)
  # ===========================================================================

  data:
    build:
      context: .
      dockerfile: Dockerfile.data
    container_name: sapheneia-data
    ports:
      - "${DATA_API_PORT:-12701}:8000"
    environment:
      - INFLUXDB_URL=http://user-influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-your_super_secret_admin_token}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-aleutian-finance}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-financial-data}
    networks:
      - aleutian-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ===========================================================================
  # Metrics Service
  # ===========================================================================

  metrics:
    build:
      context: .
      dockerfile: Dockerfile.metrics
    container_name: sapheneia-metrics
    ports:
      - "${METRICS_PORT:-12702}:8000"
    environment:
      - METRICS_HOST=0.0.0.0
      - METRICS_PORT=8000
      - LOG_LEVEL=${METRICS_LOG_LEVEL:-INFO}
    networks:
      - aleutian-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  aleutian-network:
    external: true
    name: aleutian-shared

volumes:
  forecast_models_timesfm20:
    driver: local
  ui_results:
    driver: local
