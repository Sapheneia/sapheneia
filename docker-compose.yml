# =============================================================================
# Sapheneia v2 — Docker Compose
# =============================================================================
# Stateless service mesh + orchestrator + TimescaleDB + sapheneia-mcp.
# All services share the internal `sapheneia-net` bridge network.
# Run with the default `cpu` profile, or `--profile gpu` for CUDA variants.
# =============================================================================

services:

  # --- Persistence -----------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: sapheneia-timescaledb
    environment:
      POSTGRES_USER:     ${TIMESCALEDB_USER:-sapheneia}
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-sapheneia}
      POSTGRES_DB:       ${TIMESCALEDB_DB:-sapheneia}
    ports:
      - "${TIMESCALEDB_PORT:-5432}:5432"
    volumes:
      - ./.timescaledb-data:/var/lib/postgresql/data
    networks: [sapheneia-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALEDB_USER:-sapheneia}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # --- Forecast gateway + per-model containers (CPU profile) ----------------
  forecast:
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: Dockerfile.forecast
      args:
        MODEL_NAME: all
        MODEL_PORT: 8000
    container_name: sapheneia-forecast
    ports:
      - "${FORECAST_PORT:-12700}:8000"
    env_file: [.env]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MODEL_NAME: all
      PYTHONPATH: /app
      API_SECRET_KEY: ${API_SECRET_KEY}
      UVICORN_WORKERS: 1
    volumes:
      - ./forecast:/app/forecast
      - ./logs:/app/logs
      - forecast_models_timesfm20:/app/forecast/models/timesfm20/local
      - ${MODELS_CACHE_PATH:-./.models_cache}:/models_cache
    networks: [sapheneia-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  forecast-chronos-t5-tiny:
    profiles: ["cpu"]
    build: { context: ., dockerfile: Dockerfile.forecast, args: { MODEL_NAME: chronos, MODEL_PORT: 8000 } }
    container_name: forecast-chronos-t5-tiny
    ports: ["${CHRONOS_T5_TINY_PORT:-12710}:8000"]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MODEL_NAME: chronos
      MODEL_VARIANT: amazon/chronos-t5-tiny
      HF_HOME: /models_cache
      DEVICE: ${DEVICE:-cpu}
      PYTHONPATH: /app
      API_SECRET_KEY: ${API_SECRET_KEY}
      UVICORN_WORKERS: 1
    volumes:
      - ./forecast:/app/forecast
      - ./logs:/app/logs
      - ${MODELS_CACHE_PATH:-./.models_cache}:/models_cache
    networks: [sapheneia-net]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8000/health"], interval: 30s, timeout: 10s, retries: 3, start_period: 60s }

  forecast-chronos-t5-mini:
    profiles: ["cpu"]
    build: { context: ., dockerfile: Dockerfile.forecast, args: { MODEL_NAME: chronos, MODEL_PORT: 8000 } }
    container_name: forecast-chronos-t5-mini
    ports: ["${CHRONOS_T5_MINI_PORT:-12711}:8000"]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MODEL_NAME: chronos
      MODEL_VARIANT: amazon/chronos-t5-mini
      HF_HOME: /models_cache
      DEVICE: ${DEVICE:-cpu}
      PYTHONPATH: /app
      API_SECRET_KEY: ${API_SECRET_KEY}
      UVICORN_WORKERS: 1
    volumes:
      - ./forecast:/app/forecast
      - ./logs:/app/logs
      - ${MODELS_CACHE_PATH:-./.models_cache}:/models_cache
    networks: [sapheneia-net]
    restart: "no"
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8000/health"], interval: 30s, timeout: 10s, retries: 3, start_period: 60s }

  forecast-chronos-t5-small:
    profiles: ["cpu"]
    build: { context: ., dockerfile: Dockerfile.forecast, args: { MODEL_NAME: chronos, MODEL_PORT: 8000 } }
    container_name: forecast-chronos-t5-small
    ports: ["${CHRONOS_T5_SMALL_PORT:-12712}:8000"]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MODEL_NAME: chronos
      MODEL_VARIANT: amazon/chronos-t5-small
      HF_HOME: /models_cache
      DEVICE: ${DEVICE:-cpu}
      PYTHONPATH: /app
      API_SECRET_KEY: ${API_SECRET_KEY}
      UVICORN_WORKERS: 1
    volumes:
      - ./forecast:/app/forecast
      - ./logs:/app/logs
      - ${MODELS_CACHE_PATH:-./.models_cache}:/models_cache
    networks: [sapheneia-net]
    restart: "no"
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8000/health"], interval: 30s, timeout: 10s, retries: 3, start_period: 60s }

  forecast-chronos-t5-base:
    profiles: ["cpu"]
    build: { context: ., dockerfile: Dockerfile.forecast, args: { MODEL_NAME: chronos, MODEL_PORT: 8000 } }
    container_name: forecast-chronos-t5-base
    ports: ["${CHRONOS_T5_BASE_PORT:-12713}:8000"]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MODEL_NAME: chronos
      MODEL_VARIANT: amazon/chronos-t5-base
      HF_HOME: /models_cache
      DEVICE: ${DEVICE:-cpu}
      PYTHONPATH: /app
      API_SECRET_KEY: ${API_SECRET_KEY}
      UVICORN_WORKERS: 1
    volumes:
      - ./forecast:/app/forecast
      - ./logs:/app/logs
      - ${MODELS_CACHE_PATH:-./.models_cache}:/models_cache
    networks: [sapheneia-net]
    restart: "no"
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8000/health"], interval: 30s, timeout: 10s, retries: 3, start_period: 60s }

  forecast-chronos-t5-large:
    profiles: ["cpu"]
    build: { context: ., dockerfile: Dockerfile.forecast, args: { MODEL_NAME: chronos, MODEL_PORT: 8000 } }
    container_name: forecast-chronos-t5-large
    ports: ["${CHRONOS_T5_LARGE_PORT:-12714}:8000"]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MODEL_NAME: chronos
      MODEL_VARIANT: amazon/chronos-t5-large
      HF_HOME: /models_cache
      DEVICE: ${DEVICE:-cpu}
      PYTHONPATH: /app
      API_SECRET_KEY: ${API_SECRET_KEY}
      UVICORN_WORKERS: 1
    volumes:
      - ./forecast:/app/forecast
      - ./logs:/app/logs
      - ${MODELS_CACHE_PATH:-./.models_cache}:/models_cache
    networks: [sapheneia-net]
    restart: "no"
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8000/health"], interval: 30s, timeout: 10s, retries: 3, start_period: 60s }

  forecast-timesfm-2-0:
    profiles: ["cpu"]
    build: { context: ., dockerfile: Dockerfile.forecast, args: { MODEL_NAME: timesfm20, MODEL_PORT: 8000 } }
    container_name: forecast-timesfm-2-0
    ports: ["${TIMESFM_2_0_PORT:-12721}:8000"]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MODEL_NAME: timesfm20
      TIMESFM20_DEFAULT_CHECKPOINT: google/timesfm-2.0-500m-pytorch
      HF_HOME: /models_cache
      DEVICE: ${DEVICE:-cpu}
      PYTHONPATH: /app
      API_SECRET_KEY: ${API_SECRET_KEY}
      UVICORN_WORKERS: 1
    volumes:
      - ./forecast:/app/forecast
      - ./logs:/app/logs
      - forecast_models_timesfm20:/app/forecast/models/timesfm20/local
      - ${MODELS_CACHE_PATH:-./.models_cache}:/models_cache
    networks: [sapheneia-net]
    restart: "no"
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8000/health"], interval: 30s, timeout: 10s, retries: 3, start_period: 120s }

  # --- Trading service -------------------------------------------------------
  trading:
    build: { context: ., dockerfile: Dockerfile.trading }
    container_name: sapheneia-trading
    ports: ["${TRADING_API_PORT:-12132}:9000"]
    env_file: [.env]
    environment:
      TRADING_API_KEY: ${TRADING_API_KEY}
      TRADING_API_HOST: 0.0.0.0
      TRADING_API_PORT: 9000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PYTHONPATH: /app
    volumes:
      - ./trading:/app/trading
      - ./logs:/app/logs
    networks: [sapheneia-net]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:9000/health"], interval: 30s, timeout: 10s, retries: 3, start_period: 40s }

  # --- Metrics service -------------------------------------------------------
  metrics:
    build: { context: ., dockerfile: Dockerfile.metrics }
    container_name: sapheneia-metrics
    ports: ["${METRICS_PORT:-12702}:8000"]
    env_file: [.env]
    environment:
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 8000
      METRICS_API_KEY: ${METRICS_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks: [sapheneia-net]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8000/health"], interval: 30s, timeout: 10s, retries: 3, start_period: 10s }

  # --- Data service (Python) ------------------------------------------------
  data:
    build: { context: ., dockerfile: Dockerfile.data }
    container_name: sapheneia-data
    ports: ["${DATA_API_PORT:-12701}:8000"]
    env_file: [.env]
    environment:
      DATA_HOST: 0.0.0.0
      DATA_PORT: 8000
      DATA_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_API_KEY: ${DATA_API_KEY:-}
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: 5432
      TIMESCALEDB_USER: ${TIMESCALEDB_USER:-sapheneia}
      TIMESCALEDB_PASSWORD: ${TIMESCALEDB_PASSWORD:-sapheneia}
      TIMESCALEDB_DB: ${TIMESCALEDB_DB:-sapheneia}
    volumes:
      - ./data:/app/data
      - ./shared:/app/shared
      - ./logs:/app/logs
    depends_on:
      timescaledb: { condition: service_healthy }
    networks: [sapheneia-net]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8000/health"], interval: 30s, timeout: 10s, retries: 3, start_period: 15s }

  # --- Orchestrator service -------------------------------------------------
  orchestrator:
    build: { context: ., dockerfile: Dockerfile.orchestrator }
    container_name: sapheneia-orchestrator
    ports: ["${ORCHESTRATOR_PORT:-12704}:8000"]
    env_file: [.env]
    environment:
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: 8000
      ORCHESTRATOR_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-}
      ORCHESTRATOR_DATA_SERVICE_URL: http://data:8000
      ORCHESTRATOR_FORECAST_SERVICE_URL: http://forecast:8000
      ORCHESTRATOR_TRADING_SERVICE_URL: http://trading:9000
      ORCHESTRATOR_METRICS_SERVICE_URL: http://metrics:8000
      ORCHESTRATOR_DATA_API_KEY: ${DATA_API_KEY:-}
      ORCHESTRATOR_FORECAST_API_KEY: ${API_SECRET_KEY:-}
      ORCHESTRATOR_TRADING_API_KEY: ${TRADING_API_KEY:-}
      ORCHESTRATOR_METRICS_API_KEY: ${METRICS_API_KEY:-}
      ORCHESTRATOR_MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-4}
      ORCHESTRATOR_MAX_PER_MODEL: ${MAX_PER_MODEL:-2}
      TIMESCALEDB_HOST: timescaledb
      TIMESCALEDB_PORT: 5432
      TIMESCALEDB_USER: ${TIMESCALEDB_USER:-sapheneia}
      TIMESCALEDB_PASSWORD: ${TIMESCALEDB_PASSWORD:-sapheneia}
      TIMESCALEDB_DB: ${TIMESCALEDB_DB:-sapheneia}
    volumes:
      - ./orchestrator:/app/orchestrator
      - ./shared:/app/shared
      - ./logs:/app/logs
    depends_on:
      timescaledb: { condition: service_healthy }
      data: { condition: service_healthy }
    networks: [sapheneia-net]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:8000/health"], interval: 30s, timeout: 10s, retries: 3, start_period: 15s }

  # --- sapheneia-mcp server (HTTP/SSE) -------------------------------------
  sapheneia-mcp:
    build: { context: ., dockerfile: Dockerfile.mcp }
    container_name: sapheneia-mcp
    ports: ["${SAPHENEIA_MCP_PORT:-12703}:8000"]
    env_file: [.env]
    environment:
      SAPHENEIA_MCP_HOST: 0.0.0.0
      SAPHENEIA_MCP_PORT: 8000
      SAPHENEIA_MCP_TOKEN: ${SAPHENEIA_MCP_TOKEN:-}
      SAPHENEIA_MCP_ORCHESTRATOR_URL: http://orchestrator:8000
      SAPHENEIA_MCP_DATA_URL: http://data:8000
      SAPHENEIA_MCP_FORECAST_URL: http://forecast:8000
      SAPHENEIA_MCP_TRADING_URL: http://trading:9000
      SAPHENEIA_MCP_METRICS_URL: http://metrics:8000
      SAPHENEIA_MCP_ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-}
      SAPHENEIA_MCP_DATA_API_KEY: ${DATA_API_KEY:-}
      SAPHENEIA_MCP_FORECAST_API_KEY: ${API_SECRET_KEY:-}
      SAPHENEIA_MCP_TRADING_API_KEY: ${TRADING_API_KEY:-}
      SAPHENEIA_MCP_METRICS_API_KEY: ${METRICS_API_KEY:-}
    depends_on:
      orchestrator: { condition: service_healthy }
    networks: [sapheneia-net]
    restart: unless-stopped

networks:
  sapheneia-net:
    driver: bridge

volumes:
  forecast_models_timesfm20:
    driver: local
